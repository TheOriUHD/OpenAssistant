; OpenAssistant: Home Assistant voice panel for the Waveshare ESP32-C6-Touch-AMOLED-2.16.
; Pure ESP-IDF (no Arduino): the board has no PSRAM, so we want full control
; over every allocation. Components come from the IDF component manager via
; src/idf_component.yml.
[env:c6_amoled_216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
